[package]
name = "jsonwebtoken"
version = "9.3.1"
edition = "2021"
description = "Thin wrapper that re-exports jsonwebtoken-aws-lc (aws-lc-rs backend) in place of the original ring-based jsonwebtoken crate."

[features]
default = ["use_pem"]
use_pem = ["jsonwebtoken-aws-lc/use_pem"]

[dependencies]
jsonwebtoken-aws-lc = { version = "9.3.0", default-features = false }
